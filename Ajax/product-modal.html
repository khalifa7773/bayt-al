<!-- هذا الملف يتم تحميله عبر Ajax داخل صفحة المنتجات ولا يُفتح مباشرة -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">تفاصيل المنتج</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
      </div>
      <div class="modal-body text-center">
        <i class="fa-solid fa-couch product-modal-icon"></i>
        <h5 class="mt-3">مجلس فاخر</h5>
        <p>خامات عالية الجودة وتصميم أنيق يناسب جميع الأذواق.</p>
        <p class="fw-bold product-modal-price">4500 ر.س</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-gold" id="addToCartBtn">أضف إلى السلة</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
      </div>
    </div>
  </div>
</div>
